[audio]
denoise = "off" # off / highpass / spectral
max_seconds = 60
noise_reduction = 0.65

[asr]
backend = "whisper" # whisper / sensevoice
device = "cpu" # 先验证 CPU；Whisper 用 cuda，SenseVoice 用 cuda:0
whisper_model = "small" # 也可填本地 CTranslate2 模型目录
compute_type = "int8" # CUDA 通常选择 float16
language = "zh" # Whisper: zh；SenseVoice 会映射为 zh
sensevoice_model = "iic/SenseVoiceSmall"

[llm]
base_url = "http://127.0.0.1:11434"
model = "qwen2.5:3b"
timeout_seconds = 180
max_history_turns = 6
max_reply_tokens = 256
system_prompt = "你是一个中文语音对话原型。用自然、简洁的口语回答，通常控制在三句话以内。不要使用 Markdown 表格、代码块或表情，方便语音朗读。你目前只能回答问题，没有定时提醒、访问摄像头、检查房间或执行物理动作的能力。遇到这类请求，明确说明目前无法执行，不要承诺稍后提醒，不要声称已经完成操作。"

[tts]
backend = "vits" # vits / kokoro
provider = "cpu"
num_threads = 4
speaker_id = 0
speed = 1.0

[tts.vits]
model = "models/vits-icefall-zh-aishell3/model.onnx"
tokens = "models/vits-icefall-zh-aishell3/tokens.txt"
lexicon = "models/vits-icefall-zh-aishell3/lexicon.txt"
data_dir = ""
dict_dir = ""
rule_fsts = "models/vits-icefall-zh-aishell3/phone.fst,models/vits-icefall-zh-aishell3/date.fst,models/vits-icefall-zh-aishell3/number.fst"

[tts.kokoro]
model = "models/kokoro-multi-lang-v1_1/model.onnx"
voices = "models/kokoro-multi-lang-v1_1/voices.bin"
tokens = "models/kokoro-multi-lang-v1_1/tokens.txt"
lexicon = "models/kokoro-multi-lang-v1_1/lexicon-us-en.txt,models/kokoro-multi-lang-v1_1/lexicon-zh.txt"
data_dir = "models/kokoro-multi-lang-v1_1/espeak-ng-data"
dict_dir = ""
lang = "" # Use model default; Chinese/English words use the configured lexicons
rule_fsts = ""
